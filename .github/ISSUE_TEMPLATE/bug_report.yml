name: Bug report
description: Something is wrong (a crash, a wrong number, a broken page)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: For a wrong metric, give the metric ID, the match source and map. Never attach private demos publicly.
  - type: input
    id: version
    attributes:
      label: Version
