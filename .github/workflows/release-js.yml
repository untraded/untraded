name: Release npm package

on:
  push:
    tags: ["js-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC) and provenance, no token stored
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./packages/untraded-js/package.json').version")
          test "js-v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != js-v${version}"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter untraded test
      - run: pnpm --filter untraded build
      - run: npm install -g npm@latest # staged publishing needs npm >= 11.15
      # Staged publishing: the version waits on npmjs.com until a maintainer approves it with 2FA,
      # so a compromised CI cannot release on its own.
      - run: npm stage publish --provenance --access public
        working-directory: packages/untraded-js
