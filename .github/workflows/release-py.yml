name: Release Python package

on:
  push:
    tags: ["py-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - name: Check tag matches package version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('packages/untraded-py/pyproject.toml','rb'))['project']['version'])")
          test "py-v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != py-v${version}"; exit 1; }
      - run: uv build --package untraded --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing (OIDC), no token stored
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
