#
# Self-hosting: the ingestion chain (database, migrations, worker, collector) and the site (API
# and web). See docs/self-hosting.md. Secrets come from the environment (a `.env` next to this file, or the
# stack variables of Portainer), never from git.
#
#   docker compose up -d --build
name: untraded

x-database-url: &database-url
  UNTRADED_DATABASE_URL: postgresql://untraded:${UNTRADED_DB_PASSWORD:?set UNTRADED_DB_PASSWORD}@db:5432/untraded

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: untraded
      POSTGRES_PASSWORD: ${UNTRADED_DB_PASSWORD:?set UNTRADED_DB_PASSWORD}
      POSTGRES_DB: untraded
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "untraded"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  # A pg_dump every day at UNTRADED_BACKUP_HOUR (UTC) into the `backups` volume: the last
  # UNTRADED_BACKUP_KEEP_DAYS daily dumps, plus Sunday's for UNTRADED_BACKUP_KEEP_WEEKS weeks.
  # Copy that volume off the machine: see docs/self-hosting.md, "Backups".
  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: untraded
      PGDATABASE: untraded
      PGPASSWORD: ${UNTRADED_DB_PASSWORD:?set UNTRADED_DB_PASSWORD}
      BACKUP_HOUR: ${UNTRADED_BACKUP_HOUR:-3}
      KEEP_DAYS: ${UNTRADED_BACKUP_KEEP_DAYS:-7}
      KEEP_WEEKS: ${UNTRADED_BACKUP_KEEP_WEEKS:-4}
    volumes:
      - backups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -u
        mkdir -p /backups/daily /backups/weekly
        while true; do
          now=$$(date -u +%s)
          next=$$(date -u -d "today $$BACKUP_HOUR:00" +%s)
          [ "$$next" -gt "$$now" ] || next=$$((next + 86400))
          sleep $$((next - now))
          name="untraded-$$(date -u +%F).dump"
          if pg_dump --format=custom --file="/backups/daily/$$name.part" \
              && mv "/backups/daily/$$name.part" "/backups/daily/$$name"; then
            [ "$$(date -u +%u)" != 7 ] || cp "/backups/daily/$$name" "/backups/weekly/$$name"
            find /backups/daily -name '*.dump' -mtime +$$((KEEP_DAYS - 1)) -delete
            find /backups/weekly -name '*.dump' -mtime +$$((KEEP_WEEKS * 7 - 1)) -delete
            echo "backup: $$name"
          else
            rm -f "/backups/daily/$$name.part"
            echo "backup: pg_dump failed" >&2
          fi
        done
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  # Applies the migrations, then exits; the services wait for it.
  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: untraded/worker:local
    # Built here, never pulled (a re-pull would look for it on Docker Hub).
    pull_policy: build
    command: ["untraded-db", "upgrade"]
    environment:
      <<: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: untraded/worker:local
    # Built here, never pulled (a re-pull would look for it on Docker Hub).
    pull_policy: build
    restart: unless-stopped
    environment:
      <<: *database-url
      # Raw demos are kept unless set: 0 deletes them once parsed (ADR 0009).
      UNTRADED_DEMO_RETENTION_DAYS: ${UNTRADED_DEMO_RETENTION_DAYS:-}
      # 1: demos may come from private addresses (a server on your network). Off by default.
      UNTRADED_ALLOW_PRIVATE_DEMO_URLS: ${UNTRADED_ALLOW_PRIVATE_DEMO_URLS:-}
    volumes:
      - store:/data/store
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *logging

  collector:
    build:
      context: .
      dockerfile: apps/collector/Dockerfile
    image: untraded/collector:local
    # Built here, never pulled (a re-pull would look for it on Docker Hub).
    pull_policy: build
    restart: unless-stopped
    environment:
      <<: *database-url
      UNTRADED_SECRET_KEY: ${UNTRADED_SECRET_KEY:?set UNTRADED_SECRET_KEY}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:?set STEAM_WEB_API_KEY}
      BOT_ACCOUNT_NAME: ${BOT_ACCOUNT_NAME:?set BOT_ACCOUNT_NAME}
      # Seeds the bot state on a fresh volume: a container cannot prompt for Steam Guard.
      BOT_REFRESH_TOKEN: ${BOT_REFRESH_TOKEN:-}
      COLLECTOR_INTERVAL_SECONDS: ${COLLECTOR_INTERVAL_SECONDS:-3600}
      MAX_MATCHES_PER_RUN: ${MAX_MATCHES_PER_RUN:-20}
    volumes:
      - collector-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: untraded/api:local
    # Built here, never pulled (a re-pull would look for it on Docker Hub).
    pull_policy: build
    restart: unless-stopped
    environment:
      <<: *database-url
      # The site's address as browsers see it; the web relays /api to this service.
      UNTRADED_PUBLIC_URL: ${UNTRADED_SITE_URL:-http://localhost:3000}/api
      UNTRADED_WEB_URL: ${UNTRADED_SITE_URL:-http://localhost:3000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: untraded/web:local
    # Built here, never pulled (a re-pull would look for it on Docker Hub).
    pull_policy: build
    restart: unless-stopped
    environment:
      UNTRADED_API_INTERNAL_URL: http://api:8000
      # Dates and times render on the server: in each player's time zone (sent by their browser),
      # else in this one (an IANA name; an unknown one falls back to Europe/Paris).
      UNTRADED_TIME_ZONE: ${UNTRADED_TIME_ZONE:-Europe/Paris}
    ports:
      # Only the web is published, on the loopback by default: put a reverse proxy with HTTPS in
      # front (UNTRADED_BIND=172.17.0.1 lets a proxy running in Docker reach it).
      - "${UNTRADED_BIND:-127.0.0.1}:${UNTRADED_WEB_PORT:-3000}:3000"
    depends_on:
      - api
    logging: *logging

volumes:
  db-data:
  store:
  collector-data:
  backups:
