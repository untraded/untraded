[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "untraded"
version = "0.0.2"
description = "Open, transparent Counter-Strike 2 match metrics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "The Untraded Authors" }]
keywords = ["counter-strike", "cs2", "esports", "analytics", "demo"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: First Person Shooters",
    "Typing :: Typed",
]
dependencies = [
    "backports.zstd>=1.0; python_version < '3.14'",
    "demoparser2==0.42.0",
]

[project.scripts]
untraded = "untraded.cli:main"

[project.urls]
Homepage = "https://github.com/untraded/untraded"
Source = "https://github.com/untraded/untraded/tree/main/packages/untraded-py"
Issues = "https://github.com/untraded/untraded/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/untraded"]
