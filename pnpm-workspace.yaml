packages:
  - packages/*
  - apps/*
  - spikes/*

# Dependency lifecycle scripts are blocked unless listed here (supply-chain hardening).
allowBuilds:
  esbuild: true
  protobufjs: false
  # Next.js and Tailwind ship prebuilt binaries: their install scripts are not needed.
  "@parcel/watcher": false
  "@swc/core": false
