version = 1

# Default for files without an SPDX header: AGPL-3.0-only.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The Untraded Authors"
SPDX-License-Identifier = "AGPL-3.0-only"

# Reusable libraries are MIT. Later annotations take precedence over earlier ones.
[[annotations]]
path = "packages/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The Untraded Authors"
SPDX-License-Identifier = "MIT"

# Our radars for the 2D viewer, drawn from the maps' navigation meshes (`untraded radars`).
[[annotations]]
path = "apps/web/public/radars/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The Untraded Authors"
SPDX-License-Identifier = "CC-BY-4.0"

# The Untraded name and logo: trademarks, all rights reserved, never under the code's licences
# (`LICENSES/LicenseRef-Untraded-Trademark.txt`). The `Logo` component carries the same identifier
# in its own header.
[[annotations]]
path = [
  "apps/web/src/app/favicon.ico",
  "apps/web/src/app/icon.svg",
  "apps/web/src/app/apple-icon.png",
  "apps/web/src/app/opengraph-image.png",
  "apps/web/public/icons/**",
  "docs/brand/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 The Untraded Authors"
SPDX-License-Identifier = "LicenseRef-Untraded-Trademark"
